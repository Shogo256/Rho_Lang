name: ρ (RHO) Language Compiler CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Install LLVM, Clang & Z3
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm libz3-dev

    - name: Lint (clippy)
      run: |
        cargo clippy --all-targets -- -D warnings
        cargo clippy --all-targets --features z3-solver -- -D warnings

    - name: Build Compiler (`rhoc`)
      run: cargo build --verbose

    - name: Run Unit Tests
      run: cargo test --verbose

    - name: Run Unit Tests (Z3 constraint backend)
      run: cargo test --verbose --features z3-solver

    - name: Check SIMD Matches The Scalar Reference
      run: cargo test --release vector_and_scalar

    - name: Differential Test The Compiler Against The Interpreter
      run: |
        cargo build --release
        for seed in 20260909 7 424242; do
          ./target/release/difftest $seed 250
        done

    - name: Prove The Emitted IR Matches The Source
      run: |
        cargo build --release --features z3-solver
        ./target/release/validate
        ./target/release/negcontrol

    - name: Fuzz The Constraint Solver Against Real Runs
      run: |
        cargo build --release
        cp target/release/rhoc rhoc-interval
        cargo build --release --features z3-solver
        cp target/release/rhoc rhoc-z3
        RHOC_INTERVAL=./rhoc-interval RHOC_Z3=./rhoc-z3 \
          python3 scripts/fuzz_solver.py 42 150

    - name: Run Sample Compilation (`teichmuller.rho`)
      run: cargo run --bin rhoc -- examples/teichmuller.rho --dump-dag --dump-llvm

    - name: Check Codegen Determinism
      run: |
        cargo run --quiet --bin rhoc -- examples/teichmuller.rho --dump-llvm > a.ll
        cargo run --quiet --bin rhoc -- examples/teichmuller.rho --dump-llvm > b.ll
        diff a.ll b.ll


    - name: Run Python FFI Examples
      run: |
        python3 examples/run_matrix_add.py
        python3 examples/test_inline_decorator.py
        python3 examples/python_demo.py
