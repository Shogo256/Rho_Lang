name: ρ (RHO) Language Compiler CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Install LLVM & Clang
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm

    - name: Lint (clippy)
      run: cargo clippy --all-targets -- -D warnings

    - name: Build Compiler (`rhoc`)
      run: cargo build --verbose

    - name: Run Unit Tests
      run: cargo test --verbose

    # The vector lowering is what a new operation breaks first: every lowered
    # kernel is run with and without it and the bits must match.
    - name: Check SIMD Matches The Scalar Reference
      run: cargo test --release vector_and_scalar

    # Random programs, both widths, both entrypoints, against the interpreter.
    - name: Differential Test The Compiler Against The Interpreter
      run: |
        cargo build --release
        for seed in 20260909 7 424242 99 2024 31337; do
          ./target/release/difftest $seed 300
        done

    - name: Run Sample Compilation (`teichmuller.rho`)
      run: cargo run --bin rhoc -- examples/teichmuller.rho --dump-dag --dump-llvm

    - name: Compile The Examples
      run: |
        cargo run --bin rhoc -- examples/jacobi.rho --tau 1e-12 --max-iter 200
        cargo run --bin rhoc -- examples/laplace.rho --tau 1e-6 --max-iter 2000
        cargo run --bin rhoc -- examples/min_plus.rho
        cargo run --bin rhoc -- examples/window.rho

    - name: Check Codegen Determinism
      run: |
        cargo run --quiet --bin rhoc -- examples/teichmuller.rho --dump-llvm > a.ll
        cargo run --quiet --bin rhoc -- examples/teichmuller.rho --dump-llvm > b.ll
        diff a.ll b.ll


    - name: Run Python FFI Examples
      run: |
        python3 examples/run_matrix_add.py
        python3 examples/test_inline_decorator.py
        python3 examples/python_demo.py
        python3 examples/run_matmul.py
        python3 examples/run_jacobi.py

  wheels:
    name: Wheel (${{ matrix.os }})
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    # The wheel carries the rhoc binary and the pure-Python `rho` package.
    # Nothing links against Python, so one wheel per platform serves every
    # interpreter version.
    - name: Build The Wheel
      uses: PyO3/maturin-action@v1
      with:
        command: build
        args: --release --out dist

    - name: Build The Source Distribution
      if: matrix.os == 'ubuntu-latest'
      uses: PyO3/maturin-action@v1
      with:
        command: sdist
        args: --out dist

    # Install the wheel away from the checkout, so the `rhoc` it finds is the
    # one it shipped and not `cargo run`. clang is still needed at run time.
    - name: Smoke Test The Installed Wheel
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        python3 -m venv wheel-env
        wheel-env/bin/pip install --no-index dist/*.whl
        cp examples/matmul.rho /tmp/matmul.rho
        cd /tmp
        "$GITHUB_WORKSPACE/wheel-env/bin/python" - <<'PY'
        import ctypes, rho
        print("compiler:", rho.rhoc_command())
        engine = rho.RhoEngine("/tmp/libmatmul.so")
        engine.compile_rho_file("/tmp/matmul.rho")
        a = (ctypes.c_double * 6)(1, 2, 3, 4, 5, 6)
        b = (ctypes.c_double * 12)(1, 0, 2, 1, 0, 1, 1, 2, 3, 1, 0, 1)
        c = (ctypes.c_double * 8)()
        engine.execute_spaces({"A": a, "B": b, "OUTPUT": c})
        assert list(c) == [10, 5, 4, 8, 22, 11, 13, 20], list(c)
        print("installed wheel computes A x B:", list(c))
        PY

    - uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}
        path: dist

  # A tag `vX.Y.Z` publishes the wheels built above. Needs the PYPI_API_TOKEN
  # secret; without it this job fails and nothing else is affected.
  publish:
    name: Publish To PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: wheels
    runs-on: ubuntu-latest

    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: wheels-*
        merge-multiple: true
        path: dist

    - name: Upload
      uses: PyO3/maturin-action@v1
      env:
        MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      with:
        command: upload
        args: --non-interactive --skip-existing dist/*
