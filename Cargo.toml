[package]
name = "rho-lang"
version = "0.1.0"
edition = "2021"
description = "Compiler for ρ (RHO) Language: Time-eliminated topological dataflow language"
license = "Apache-2.0"
repository = "https://github.com/Escoffier1156/Rho_Lang"
readme = "README.md"

[[bin]]
name = "rhoc"
path = "src/main.rs"

[[bin]]
name = "difftest"
path = "src/bin/difftest.rs"

[[bin]]
name = "validate"
path = "src/bin/validate.rs"

[[bin]]
name = "negcontrol"
path = "src/bin/negcontrol.rs"

[dependencies]
nom = "7.1"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
petgraph = "0.6"
z3 = { version = "0.12", optional = true }
libloading = "0.8"

[features]
default = []
z3-solver = ["dep:z3"]
